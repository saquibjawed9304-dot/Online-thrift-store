<div id="page-cart" class="page">
  <div class="page-title">Your Cart 🛒</div>
  <div class="cart-container" id="cart-container">
    <div id="cart-empty" style="text-align:center;padding:60px;color:#888">
      <div style="font-size:44px;margin-bottom:12px">🛒</div>
      <p style="font-size:16px">Your cart is empty.</p>
      <button onclick="goTo('men')" style="margin-top:16px">Start Shopping</button>

  <div id="cart-total-box" style="display:none;padding:20px 30px;border-top:2px solid #000;text-align:right">

    <button class="checkout-btn" onclick="goTo('address')">Proceed to Delivery →</button>
  </div>
