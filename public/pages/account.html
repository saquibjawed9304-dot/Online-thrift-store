<div id="page-account" class="page">
  <div class="page-title">My Account 👤</div>
  <div style="max-width:600px;margin:0 auto;padding:0 30px 60px">
    
    <!-- Profile Header -->
    <div style="text-align:center;margin-bottom:30px;padding:20px;background:rgba(255,255,255,0.5);border-radius:15px;border:1px solid rgba(255,255,255,0.3)">
      <div style="font-size:60px;margin-bottom:10px">👤</div>
      <h2 id="acc-name-display" style="font-family:'Playfair Display',serif;margin:0">Loading...</h2>
      <p id="acc-email-display" style="color:#666;margin:5px 0 0">loading...</p>
    </div>

    <!-- Update Profile Form -->
    <div style="margin-bottom:40px">
      <h3 style="font-family:'Playfair Display',serif;margin-bottom:15px;font-size:18px">Update Profile</h3>
      <div class="form-row">
        <div class="form-group">
          <label>Full Name</label>
          <input id="upd-name" type="text" placeholder="Update your name">
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input id="upd-phone" type="tel" placeholder="+91 XXXXXXXXXX">
        </div>
      </div>
      <button onclick="doUpdateAccount()" style="width:100%;margin-top:10px">Save Profile Changes</button>
      
      <div style="display:flex;gap:12px;margin-top:12px">
        <button onclick="goTo('address')" class="hbtn" style="flex:1;background:#f5f5f5;color:#333;border:1.5px solid #ddd;padding:10px;border-radius:8px">Manage Addresses</button>
        <button onclick="doLogout()" class="hbtn" style="flex:1;background:#fff1f1;color:#e05252;border:1.5px solid #ffcfcf;padding:10px;border-radius:8px">Logout</button>
      </div>
    </div>

    <hr style="border:none;border-top:1px solid #eee;margin:30px 0">

    <!-- Seller Section -->
    <div id="admin-actions" style="display:none">
      <h3>Community Seller Panel</h3>
      <div class="admin-card-inner">
        <p style="font-size:13px;color:#888;margin-bottom:5px">Ready to list your own vintage treasures?</p>
        <button onclick="goTo('add-product')" class="admin-btn-premium">Add New Product 🏺</button>
      </div>
    </div>

    <!-- Order History Section -->
    <div style="margin-top:40px">
      <h3 style="font-family:'Playfair Display',serif;margin-bottom:15px;font-size:18px">My Orders</h3>
      <div id="acc-orders" style="color:#888;font-size:14px;text-align:center;padding:30px;background:#fafafa;border-radius:10px;border:1px dashed #ddd">
        You haven't placed any orders yet.
      </div>
    </div>

  </div>
</div>
